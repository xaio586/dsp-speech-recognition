    <script vid="79">
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl');

        const vsSource = `
            attribute vec4 aVertexPosition;
            varying vec2 vUv;
            void main() {
                gl_Position = aVertexPosition;
                vUv = aVertexPosition.xy * 0.5 + 0.5;
            }
        `;

        const fsSource = `
            precision highp float;
            varying vec2 vUv;
            uniform float uTime;
            uniform vec2 uResolution;

            vec3 colorA = vec3(0.91, 0.36, 0.02); 
            vec3 colorB = vec3(0.91, 0.77, 0.42); 
            vec3 colorC = vec3(0.66, 0.85, 0.86); 
            vec3 colorD = vec3(0.16, 0.62, 0.56); 
            vec3 colorE = vec3(0.11, 0.21, 0.34); 

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

            float snoise(vec2 v) {
                const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy) );
                vec2 x0 = v -   i + dot(i, C.xx);
                vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod289(i);
                vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m*m*m ;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            void main() {
                vec2 st = gl_FragCoord.xy / uResolution.xy;
                st.x *= uResolution.x / uResolution.y;
                float n1 = snoise(st * 1.2 + uTime * 0.05);
                float n2 = snoise(st * 1.8 - uTime * 0.08 + n1);
                vec2 warpedSt = st + vec2(n1, n2) * 0.4;
                vec3 finalColor = mix(colorA, colorB, smoothstep(0.0, 1.5, length(warpedSt - vec2(0.2, 0.8))));
                finalColor = mix(finalColor, colorC, smoothstep(0.2, 1.8, length(warpedSt - vec2(0.5))));
                finalColor = mix(finalColor, colorE, smoothstep(0.4, 2.0, length(warpedSt - vec2(0.8, 0.2))));
                float grain = random(vUv * (uTime * 0.001 + 100.0));
                gl_FragColor = vec4(finalColor + (grain - 0.5) * 0.18, 1.0);
            }
        `;

        function loadShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const shaderProgram = gl.createProgram();
        gl.attachShader(shaderProgram, loadShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(shaderProgram, loadShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(shaderProgram);

        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([1,1,-1,1,1,-1,-1,-1]), gl.STATIC_DRAW);

        const posLoc = gl.getAttribLocation(shaderProgram, 'aVertexPosition');
        const timeLoc = gl.getUniformLocation(shaderProgram, 'uTime');
        const resLoc = gl.getUniformLocation(shaderProgram, 'uResolution');

        function render(now) {
            canvas.width = 1440; canvas.height = 900;
            gl.viewport(0, 0, 1440, 900);
            gl.useProgram(shaderProgram);
            gl.enableVertexAttribArray(posLoc);
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
            gl.uniform1f(timeLoc, now * 0.001);
            gl.uniform2f(resLoc, 1440, 900);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
