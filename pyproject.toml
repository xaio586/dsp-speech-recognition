[project]
name = "dsp-speech-recognition"
version = "0.1.0"
description = "Isolated digit speech recognition experiments using time-domain features, MFCC, and DTW"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

